name: Copy applestoree/applestoree

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: applestoree/applestoree
          ref: main
          path: _source
          fetch-depth: 1

      - name: Replace destination with source
        shell: bash
        run: |
          set -e
          rm -rf _source/.git
          find . -mindepth 1 -maxdepth 1 ! -name '_source' ! -name '.git' -exec rm -rf {} +
          cp -a _source/. .
          rm -rf _source

      - name: Commit copied repository
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Copy applestoree/applestoree to applestoree.github.io'
          git push origin HEAD:main
